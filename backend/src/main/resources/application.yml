server:
  port: 8081

spring:
  application:
    name: fraudshield-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/fraudshield
    username: fraudshield
    password: fraudshield

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fraudshield-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  jwt:
    secret: ${JWT_SECRET:fraudshield-dev-secret-key-change-me-in-production-2026}
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:4200
  kafka:
    topics:
      transactions: transactions
      alerts: alerts
  fraud:
    # Score final à partir duquel une transaction passe en A_VERIFIER
    # (le blocage automatique est la règle AUTO_BLOCK_SCORE en base)
    review-threshold: 50
  ml:
    # Métriques du modèle (notebook ml/02_entrainement.ipynb) : premier fichier trouvé.
    # 1. dossier ml/ du projet (backend lancé depuis backend/) ou chemin donné par MODEL_METRICS_PATH
    # 2. copie dans src/main/resources/ml/model_metrics.json
    metrics-locations: ${MODEL_METRICS_PATH:file:../ml/models/model_metrics.json},classpath:ml/model_metrics.json
