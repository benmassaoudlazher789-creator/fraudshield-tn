<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FraudShield WS Test</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 16px; background: #f6f7f9; color: #1d2330; }
        h1 { font-size: 18px; margin: 0 0 12px; }
        #status { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #ddd; font-size: 13px; }
        #status.ok { background: #c8f0d2; } #status.ko { background: #f6cccc; }
        .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
        @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
        section { background: #fff; border: 1px solid #dde1e7; border-radius: 6px; padding: 10px; min-width: 0; }
        h2 { font-size: 15px; margin: 0 0 8px; }
        pre { margin: 0 0 6px; padding: 6px; font-size: 12px; background: #f1f3f6; border-left: 4px solid #999;
              white-space: pre-wrap; word-break: break-all; }
        pre.BLOQUEE { border-color: #d33; } pre.A_VERIFIER { border-color: #e9a200; } pre.ACCEPTEE { border-color: #2a9d4b; }
    </style>
</head>
<body>
<h1>FraudShield – test STOMP <span id="status">déconnecté</span></h1>
<div class="cols">
    <section><h2>/topic/alerts</h2><div id="alerts"></div></section>
    <section><h2>/topic/transactions</h2><div id="transactions"></div></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script>
    const statusEl = document.getElementById('status');
    const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';

    // Ajoute un message en tête de liste (50 max)
    function show(containerId, body) {
        const data = JSON.parse(body);
        const pre = document.createElement('pre');
        pre.className = data.status || data.decision || '';
        pre.textContent = new Date().toLocaleTimeString() + '\n' + JSON.stringify(data, null, 2);
        const container = document.getElementById(containerId);
        container.prepend(pre);
        while (container.children.length > 50) container.lastChild.remove();
    }

    const client = new StompJs.Client({
        brokerURL: wsUrl,
        reconnectDelay: 3000,
        onConnect: () => {
            statusEl.textContent = 'connecté'; statusEl.className = 'ok';
            client.subscribe('/topic/alerts', m => show('alerts', m.body));
            client.subscribe('/topic/transactions', m => show('transactions', m.body));
        },
        onWebSocketClose: () => { statusEl.textContent = 'déconnecté'; statusEl.className = 'ko'; },
        onStompError: f => console.error('Erreur STOMP', f.headers.message, f.body)
    });
    client.activate();
</script>
</body>
</html>
