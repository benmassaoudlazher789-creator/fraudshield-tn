<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>FraudShield TN</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Thème appliqué avant le rendu (évite un flash clair) ; ThemeService prend ensuite le relais -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('fs_theme'); } catch (e) { /* stockage indisponible */ }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      if (theme === 'dark') { document.documentElement.classList.add('fs-dark'); }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
